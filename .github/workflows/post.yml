name: morestayz auto-publish

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST — 하루 1회 묶음 배포(빌드 1회)
  workflow_dispatch:
    inputs:
      batch:
        description: '수동 신규 발행 수(기본 6)'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate + build (batched)
        env:
          BATCH: ${{ github.event.inputs.batch || '6' }}   # 예약 실행: 하루 6개 드립(시즌 선행 발행)
        run: node publish.js

      - name: Commit & push if changed
        run: |
          git config user.name "morestayz-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: auto-publish $(date -u +%Y-%m-%d)"
            git pull --rebase -X ours origin main || true
            git push
          else
            echo "변경 없음 — 스킵"
          fi

      - name: IndexNow (after deploy is live)
        run: |
          node indexnow.js --wait || true
          if [ -n "$(git status --porcelain data/indexnow-state.json)" ]; then
            git add data/indexnow-state.json
            git commit -m "chore: IndexNow $(date -u +%Y-%m-%d)"
            git pull --rebase -X ours origin main || true
            git push
          fi
